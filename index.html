<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Economy</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); padding:16px; }
  main { max-width:560px; margin:0 auto; }
  h1 { margin:0 0 4px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin:12px 0; }
  .money { font-size:2rem; font-weight:700; color:var(--accent); }
  button { background:var(--accent); color:#052e16; border:0; border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--muted); }
  input { padding:9px; border-radius:8px; border:1px solid var(--muted); background:var(--bg); color:var(--fg); width:100%; margin:4px 0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-top:1px solid #334155; }
  .row:first-of-type { border-top:0; }
  small, .muted { color:var(--muted); }
  #status { min-height:1.2em; }
</style>
</head>
<body>
<main>
  <h1>Economy</h1>
  <div class="muted" id="status">Loading...</div>

  <div class="card">
    <div class="muted">Cash</div>
    <div class="money" id="cash">$0</div>
    <div class="muted" id="income">$0 / sec</div>
    <p><button id="work">Work (+$1)</button></p>
  </div>

  <div class="card" id="shop"><strong>Businesses</strong></div>

  <div class="card" id="account">
    <strong>Cloud save</strong>
    <div id="signedOut">
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Password (min 6)" autocomplete="current-password">
      <button id="signin">Sign in</button>
      <button id="signup" class="ghost">Sign up</button>
    </div>
    <div id="signedIn" hidden>
      <div class="muted" id="who"></div>
      <button id="saveNow">Save now</button>
      <button id="signout" class="ghost">Sign out</button>
    </div>
    <p><button id="reset" class="ghost">Reset progress</button></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const BUSINESSES = [
  { id:"lemonade", name:"Lemonade Stand", cost:15,    income:0.2 },
  { id:"shop",     name:"Corner Shop",    cost:120,   income:1.5 },
  { id:"factory",  name:"Factory",        cost:1100,  income:12  },
  { id:"bank",     name:"Bank",           cost:13000, income:90  },
];
const GROWTH = 1.15;
const LOCAL_KEY = "economy-save-v1";
const $ = id => document.getElementById(id);

const fresh = () => ({ cash:0, owned:{}, lastTick:Date.now() });
let state = fresh();
let user = null;
let sb = null;
let dirty = false;

const configured = window.SUPABASE_ANON_KEY && !window.SUPABASE_ANON_KEY.startsWith("PASTE_");
if (configured) sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const owned = id => state.owned[id] || 0;
const price = b => Math.ceil(b.cost * Math.pow(GROWTH, owned(b.id)));
const perSec = () => BUSINESSES.reduce((s,b) => s + b.income * owned(b.id), 0);
const fmt = n => "$" + (n >= 1e6 ? n.toExponential(2) : n.toLocaleString(undefined,{maximumFractionDigits:1}));
const setStatus = t => $("status").textContent = t;

function render() {
  $("cash").textContent = fmt(state.cash);
  $("income").textContent = fmt(perSec()) + " / sec";
  BUSINESSES.forEach(b => {
    const btn = $("buy-" + b.id);
    btn.disabled = state.cash < price(b);
    btn.textContent = "Buy " + fmt(price(b));
    $("own-" + b.id).textContent = "Owned: " + owned(b.id);
  });
}

function buildShop() {
  BUSINESSES.forEach(b => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div>${b.name}<br><small>+${b.income}/sec · <span id="own-${b.id}"></span></small></div>
                     <button id="buy-${b.id}"></button>`;
    $("shop").appendChild(row);
    row.querySelector("button").onclick = () => {
      const p = price(b);
      if (state.cash < p) return;
      state.cash -= p;
      state.owned[b.id] = owned(b.id) + 1;
      dirty = true; saveLocal(); render();
    };
  });
}

function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch {}
}
function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (s) return s; } catch {}
  return null;
}

// Offline earnings: credit income for time away, capped at 8 hours.
function applyOffline() {
  const secs = Math.min((Date.now() - (state.lastTick || Date.now())) / 1000, 8 * 3600);
  if (secs > 5) state.cash += perSec() * secs;
  state.lastTick = Date.now();
}

async function saveCloud() {
  if (!sb || !user) return;
  state.lastTick = Date.now();
  const { error } = await sb.from("game_saves").upsert({
    user_id: user.id, data: state, updated_at: new Date().toISOString(),
  });
  if (error) { setStatus("Cloud save failed: " + error.message); return; }
  dirty = false;
  setStatus("Saved to cloud " + new Date().toLocaleTimeString());
}

async function loadCloud() {
  if (!sb || !user) return;
  const { data, error } = await sb.from("game_saves").select("data").eq("user_id", user.id).maybeSingle();
  if (error) { setStatus("Cloud load failed: " + error.message); return; }
  if (data && data.data) {
    state = data.data;
    applyOffline();
    saveLocal();
    setStatus("Loaded cloud save.");
  } else {
    await saveCloud(); // first login: upload local progress
  }
  render();
}

function showAuth() {
  $("signedOut").hidden = !!user;
  $("signedIn").hidden = !user;
  $("who").textContent = user ? "Signed in as " + user.email : "";
}

async function auth(kind) {
  if (!sb) return setStatus("Add your anon key to config.js first.");
  const email = $("email").value.trim(), password = $("password").value;
  const fn = kind === "up" ? sb.auth.signUp : sb.auth.signInWithPassword;
  const { data, error } = await fn.call(sb.auth, { email, password });
  if (error) return setStatus(error.message);
  if (kind === "up" && !data.session) return setStatus("Check your email to confirm, then sign in.");
  user = data.user; showAuth(); await loadCloud();
}

async function init() {
  buildShop();
  state = loadLocal() || fresh();
  applyOffline();

  $("work").onclick = () => { state.cash += 1; dirty = true; render(); };
  $("signin").onclick = () => auth("in");
  $("signup").onclick = () => auth("up");
  $("signout").onclick = async () => { await saveCloud(); await sb.auth.signOut(); user = null; showAuth(); setStatus("Signed out."); };
  $("saveNow").onclick = saveCloud;
  $("reset").onclick = () => { if (confirm("Erase all progress?")) { state = fresh(); saveLocal(); dirty = true; saveCloud(); render(); } };

  if (sb) {
    const { data } = await sb.auth.getSession();
    user = data.session ? data.session.user : null;
    showAuth();
    if (user) await loadCloud(); else setStatus("Playing offline. Sign in to save to cloud.");
  } else {
    showAuth();
    setStatus("Local save only. Add your anon key in config.js for cloud save.");
  }
  render();

  setInterval(() => {            // game tick, 10x per second
    const now = Date.now();
    state.cash += perSec() * ((now - state.lastTick) / 1000);
    state.lastTick = now;
    render();
  }, 100);
  setInterval(() => { saveLocal(); if (dirty) saveCloud(); }, 30000); // autosave
  window.addEventListener("beforeunload", saveLocal);
}
init();
</script>
</body>
</html>
